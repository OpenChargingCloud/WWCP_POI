<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<title>Metrology secures two links of the chain.</title>
<rect x="0.0" y="0.0" width="1080.0" height="1350.0" rx="0" fill="#F6F4EF" stroke="none" stroke-width="0"/><text x="72.0" y="96.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#6B7A88" text-anchor="start" letter-spacing="3">CAN YOU TRUST THIS CHARGING STATION?</text><text x="1008.0" y="96.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0E9F9A" text-anchor="end" letter-spacing="3">PART 2 / 10</text><rect x="72.0" y="118.0" width="64.0" height="6.0" rx="3" fill="#0E9F9A" stroke="none" stroke-width="0"/><text x="72.0" y="200.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#14263B" text-anchor="start">Metrology secures</text><text x="72.0" y="275.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#14263B" text-anchor="start">two links of the chain.</text><text x="72.0" y="333.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="400" fill="#2A3B4F" text-anchor="start">A proof is only as strong as its weakest link.</text><rect x="365.0" y="478.0" width="22.0" height="72.0" rx="11" fill="none" stroke="#8E9BA8" stroke-width="6"/><rect x="365.0" y="610.0" width="22.0" height="72.0" rx="11" fill="none" stroke="#D9483B" stroke-width="6"/><g transform="translate(376.0,646.0) rotate(-24)"><rect x="-26.0" y="-5.0" width="52.0" height="10.0" rx="0" fill="#F6F4EF" stroke="none" stroke-width="0"/></g><rect x="365.0" y="742.0" width="22.0" height="72.0" rx="11" fill="none" stroke="#8E9BA8" stroke-width="6"/><rect x="365.0" y="874.0" width="22.0" height="72.0" rx="11" fill="none" stroke="#8E9BA8" stroke-width="6"/><rect x="365.0" y="1006.0" width="22.0" height="72.0" rx="11" fill="none" stroke="#8E9BA8" stroke-width="6"/><rect x="72.0" y="400.0" width="608.0" height="96.0" rx="18" fill="#FFFFFF" stroke="#BFE3CC" stroke-width="3"/><circle cx="120.0" cy="448.0" r="22.0" fill="#2E9E5B" stroke="none" stroke-width="0"/><path d="M110.8,448.4 L117.8,455.5 L130.1,440.5" fill="none" stroke="#FFFFFF" stroke-width="4.84" stroke-linecap="round" stroke-linejoin="round"/><text x="164.0" y="442.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#14263B" text-anchor="start">Energy</text><text x="164.0" y="476.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">kWh measured by a calibrated meter</text><rect x="72.0" y="532.0" width="608.0" height="96.0" rx="18" fill="#FFFFFF" stroke="#BFE3CC" stroke-width="3"/><circle cx="120.0" cy="580.0" r="22.0" fill="#2E9E5B" stroke="none" stroke-width="0"/><path d="M110.8,580.4 L117.8,587.5 L130.1,572.5" fill="none" stroke="#FFFFFF" stroke-width="4.84" stroke-linecap="round" stroke-linejoin="round"/><text x="164.0" y="574.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#14263B" text-anchor="start">Time</text><text x="164.0" y="608.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">timestamp signed by the meter</text><rect x="72.0" y="664.0" width="608.0" height="96.0" rx="18" fill="#FFFFFF" stroke="#F1D3A1" stroke-width="3"/><circle cx="120.0" cy="712.0" r="22.0" fill="#E39B2D" stroke="none" stroke-width="0"/><text x="120.0" y="721.2" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">?</text><text x="164.0" y="706.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#14263B" text-anchor="start">Meter key</text><text x="164.0" y="740.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">often sent along with the data</text><rect x="72.0" y="796.0" width="608.0" height="96.0" rx="18" fill="#FFFFFF" stroke="#F1D3A1" stroke-width="3"/><circle cx="120.0" cy="844.0" r="22.0" fill="#E39B2D" stroke="none" stroke-width="0"/><text x="120.0" y="853.2" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">?</text><text x="164.0" y="838.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#14263B" text-anchor="start">Charging station</text><text x="164.0" y="872.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">is it the one it claims to be?</text><rect x="72.0" y="928.0" width="608.0" height="96.0" rx="18" fill="#FFFFFF" stroke="#F1D3A1" stroke-width="3"/><circle cx="120.0" cy="976.0" r="22.0" fill="#E39B2D" stroke="none" stroke-width="0"/><text x="120.0" y="985.2" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">?</text><text x="164.0" y="970.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#14263B" text-anchor="start">Operator</text><text x="164.0" y="1004.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">who is responsible for it?</text><rect x="72.0" y="1060.0" width="608.0" height="96.0" rx="18" fill="#FFFFFF" stroke="#F1D3A1" stroke-width="3"/><circle cx="120.0" cy="1108.0" r="22.0" fill="#E39B2D" stroke="none" stroke-width="0"/><text x="120.0" y="1117.2" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">?</text><text x="164.0" y="1102.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#14263B" text-anchor="start">Tariff</text><text x="164.0" y="1136.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">which price applied?</text><path d="M712,400 q16,0 16,16 V612 q0,16 -16,16" fill="none" stroke="#2E9E5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="752.0" y="506.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#2E9E5B" text-anchor="start">Covered by</text><text x="752.0" y="540.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#2E9E5B" text-anchor="start">metrology law</text><text x="752.0" y="572.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7A88" text-anchor="start">MID · Eichrecht</text><path d="M712,664 q16,0 16,16 V1140 q0,16 -16,16" fill="none" stroke="#E39B2D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="752.0" y="870.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#A9670A" text-anchor="start">Needs</text><text x="752.0" y="904.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#A9670A" text-anchor="start">authentic</text><text x="752.0" y="938.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#A9670A" text-anchor="start">POI data</text><line x1="72.0" y1="1258.0" x2="1008.0" y2="1258.0" stroke="#D8D2C5" stroke-width="2" stroke-linecap="round"/><text x="72.0" y="1304.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" text-anchor="start"><tspan font-weight="700" fill="#14263B">WWCP_POI</tspan><tspan font-weight="400" fill="#6B7A88">  ·  open source</tspan></text><text x="1008.0" y="1304.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="
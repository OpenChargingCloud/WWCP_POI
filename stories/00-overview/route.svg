<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<title>Can you trust this charging station?</title>
<rect x="0.0" y="0.0" width="1080.0" height="1350.0" rx="0" fill="#F6F4EF" stroke="none" stroke-width="0"/><text x="72.0" y="96.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#6B7A88" text-anchor="start" letter-spacing="3">CAN YOU TRUST THIS CHARGING STATION?</text><text x="1008.0" y="96.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#0E9F9A" text-anchor="end" letter-spacing="3">OVERVIEW</text><rect x="72.0" y="118.0" width="64.0" height="6.0" rx="3" fill="#0E9F9A" stroke="none" stroke-width="0"/><text x="72.0" y="200.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#14263B" text-anchor="start">Can you trust this</text><text x="72.0" y="275.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#14263B" text-anchor="start">charging station?</text><text x="72.0" y="333.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="400" fill="#2A3B4F" text-anchor="start">A series in ten stops. No crypto degree required.</text><path d="M190.0,394.0 C190.0,400.3 179.7,412.0 190.0,432.0 C200.3,452.0 252.0,486.7 252.0,514.0 C252.0,541.3 210.7,568.7 190.0,596.0 C169.3,623.3 128.0,650.7 128.0,678.0 C128.0,705.3 169.3,732.7 190.0,760.0 C210.7,787.3 252.0,814.7 252.0,842.0 C252.0,869.3 210.7,896.7 190.0,924.0 C169.3,951.3 128.0,978.7 128.0,1006.0 C128.0,1033.3 169.3,1060.7 190.0,1088.0 C210.7,1115.3 252.0,1149.3 252.0,1170.0 C252.0,1190.7 200.3,1205.0 190.0,1212.0" fill="none" stroke="#D8D2C5" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/><path d="M190.0,394.0 C190.0,400.3 179.7,412.0 190.0,432.0 C200.3,452.0 252.0,486.7 252.0,514.0 C252.0,541.3 210.7,568.7 190.0,596.0 C169.3,623.3 128.0,650.7 128.0,678.0 C128.0,705.3 169.3,732.7 190.0,760.0 C210.7,787.3 252.0,814.7 252.0,842.0 C252.0,869.3 210.7,896.7 190.0,924.0 C169.3,951.3 128.0,978.7 128.0,1006.0 C128.0,1033.3 169.3,1060.7 190.0,1088.0 C210.7,1115.3 252.0,1149.3 252.0,1170.0 C252.0,1190.7 200.3,1205.0 190.0,1212.0" fill="none" stroke="#3B4A5A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><path d="M190.0,394.0 C190.0,400.3 179.7,412.0 190.0,432.0 C200.3,452.0 252.0,486.7 252.0,514.0 C252.0,541.3 210.7,568.7 190.0,596.0 C169.3,623.3 128.0,650.7 128.0,678.0 C128.0,705.3 169.3,732.7 190.0,760.0 C210.7,787.3 252.0,814.7 252.0,842.0 C252.0,869.3 210.7,896.7 190.0,924.0 C169.3,951.3 128.0,978.7 128.0,1006.0 C128.0,1033.3 169.3,1060.7 190.0,1088.0 C210.7,1115.3 252.0,1149.3 252.0,1170.0 C252.0,1190.7 200.3,1205.0 190.0,1212.0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="16 14"/><circle cx="190.0" cy="432.0" r="27.0" fill="#0E9F9A" stroke="#FFFFFF" stroke-width="5"/><text x="190.0" y="441.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="330.0" y="430.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#14263B" text-anchor="start">Anna's invoice</text><text x="330.0" y="460.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">Why a screenshot is no proof</text><circle cx="252.0" cy="514.0" r="27.0" fill="#0E9F9A" stroke="#FFFFFF" stroke-width="5"/><text x="252.0" y="523.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="330.0" y="512.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#14263B" text-anchor="start">The meter's own ID card</text><text x="330.0" y="542.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">Correct kWh, unverifiable key</text><circle cx="190.0" cy="596.0" r="27.0" fill="#0E9F9A" stroke="#FFFFFF" stroke-width="5"/><text x="190.0" y="605.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="330.0" y="594.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#14263B" text-anchor="start">The envelope and the letter</text><text x="330.0" y="624.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">What encryption does not protect</text><circle cx="128.0" cy="678.0" r="27.0" fill="#0E9F9A" stroke="#FFFFFF" stroke-width="5"/><text x="128.0" y="687.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="330.0" y="676.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#14263B" text-anchor="start">A land register</text><text x="330.0" y="706.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">Every change a signed entry</text><circle cx="190.0" cy="760.0" r="27.0" fill="#0E9F9A" stroke="#FFFFFF" stroke-width="5"/><text x="190.0" y="769.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="330.0" y="758.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#14263B" text-anchor="start">One fingerprint</text><text x="330.0" y="788.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">A million records, one comparison</text><circle cx="252.0" cy="842.0" r="27.0" fill="#0E9F9A" stroke="#FFFFFF" stroke-width="5"/><text x="252.0" y="851.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="330.0" y="840.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#14263B" text-anchor="start">A proof in your pocket</text><text x="330.0" y="870.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">One station, checked offline</text><circle cx="190.0" cy="924.0" r="27.0" fill="#0E9F9A" stroke="#FFFFFF" stroke-width="5"/><text x="190.0" y="933.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="330.0" y="922.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#14263B" text-anchor="start">Signed price tags</text><text x="330.0" y="952.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">Evidence that holds for months</text><circle cx="128.0" cy="1006.0" r="27.0" fill="#0E9F9A" stroke="#FFFFFF" stroke-width="5"/><text x="128.0" y="1015.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><text x="330.0" y="1004.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#14263B" text-anchor="start">The atlas &amp; the traffic report</text><text x="330.0" y="1034.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">Slow data vs. fast data</text><circle cx="190.0" cy="1088.0" r="27.0" fill="#0E9F9A" stroke="#FFFFFF" stroke-width="5"/><text x="190.0" y="1097.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><text x="330.0" y="1086.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#14263B" text-anchor="start">No master key</text><text x="330.0" y="1116.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">Two of three, no single boss</text><circle cx="252.0" cy="1170.0" r="27.0" fill="#0E9F9A" stroke="#FFFFFF" stroke-width="5"/><text x="252.0" y="1179.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text><text x="330.0" y="1168.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#14263B" text-anchor="start">Bridges, not bulldozers</text><text x="330.0" y="1198.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="start">Works with OCPI &amp; DATEX II</text><line x1="72.0" y1="1258.0" x2="1008.0" y2="1258.0" stroke="#D8D2C5" stroke-width="2" stroke-linecap="round"/><text x="72.0" y="1304.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" text-anchor="start"><tspan font-weight="700" fill="#14263B">WWCP_POI</tspan><tspan font-weight="400" fill="#6B7A88">  ·  open source</tspan></text><text x="1008.0" y="1304.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7A88" text-anchor="end">github.com/OpenChargingCloud/WWCP_POI</text>
</svg>

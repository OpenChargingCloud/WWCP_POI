', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7A88" text-anchor="start">key turned</text><rect x="72.0" y="948.0" width="300.0" height="96.0" rx="18" fill="#FFFFFF" stroke="#7B61FF" stroke-width="3"/><circle cx="112.0" cy="996.0" r="18.0" fill="#7B61FF" stroke="none" stroke-width="0"/><path d="M104.4,996.4 L110.2,1002.1 L120.3,989.9" fill="none" stroke="#FFFFFF" stroke-width="3.96" stroke-linecap="round" stroke-linejoin="round"/><text x="144.0" y="990.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#14263B" text-anchor="start">Organisation B</text><text x="144.0" y="1020.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7A88" text-anchor="start">key turned</text><rect x="708.0" y="948.0" width="300.0" height="96.0" rx="18" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="3"/><circle cx="748.0" cy="996.0" r="18.0" fill="#EDE8DD" stroke="#D8D2C5" stroke-width="2"/><text x="780.0" y="990.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#6B7A88" text-anchor="start">Organisation C</text><text x="780.0" y="1020.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7A88" text-anchor="start">not needed</text><text x="1008.0" y="412.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#2A3B4F" text-anchor="end">Everything the network signs</text><text x="1008.0" y="442.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#2A3B4F" text-anchor="end">needs the quorum – even the</text><text x="1008.0" y="472.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#2A3B4F" text-anchor="end">list of its own keys.</text><line x1="72.0" y1="1082.0" x2="1008.0" y2="1082.0" stroke="#D8D2C5" stroke-width="2" stroke-linecap="round"/><text x="72.0" y="1146.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#14263B" text-anchor="start">No central server either:</text><text x="72.0" y="1180.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#2A3B4F" text-anchor="start">every server takes signed changes</text><text x="72.0" y="1208.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#2A3B4F" text-anchor="start">and merges them the same way.</text><line x1="620.0" y1="1144.0" x2="760.0" y2="1124.0" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/><line x1="620.0" y1="1144.0" x2="900.0" y2="1144.0" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/><line x1="620.0" y1="1144.0" x2="690.0" y2="1212.0" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/><line x1="620.0" y1="1144.0" x2="840.0" y2="1212.0" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/><line x1="760.0" y1="1124.0" x2="900.0" y2="1144.0" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/><line x1="760.0" y1="1124.0" x2="690.0" y2="1212.0" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/><line x1="760.0" y1="1124.0" x2="840.0" y2="1212.0" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/><line x1="900.0" y1="1144.0" x2="690.0" y2="1212.0" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/><line x1="900.0" y1="1144.0" x2="840.0" y2="1212.0" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/><line x1="690.0" y1="1212.0" x2="840.0" y2="1212.0" stroke="#A9B4BE" stroke-width="2" stroke-linecap="round"/><rect x="598.0" y="1118.0" width="44.0" height="12.0" rx="7" fill="#2A3B4F" stroke="none" stroke-width="0"/><circle cx="614.0" cy="1124.0" r="4.5" fill="#0E9F9A" stroke="none" stroke-width="0"/><rect x="628.0" y="1121.5" width="0.0" height="5.0" rx="2.5" fill="#8E9BA8" stroke="none" stroke-width="
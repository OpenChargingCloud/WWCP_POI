" y="838.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#2A3B4F" text-anchor="start">CCS · 150 kW</text><text x="104.0" y="936.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" text-anchor="start"><tspan font-weight="700" fill="#14263B">0.3</tspan><tspan font-weight="700" fill="#D9483B">8</tspan><tspan font-weight="700" fill="#14263B"> €/kWh</tspan></text><text x="104.0" y="972.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#D9483B" text-anchor="start">one digit changed</text><line x1="528.0" y1="865.0" x2="578.0" y2="865.0" stroke="#6B7A88" stroke-width="5" stroke-linecap="round"/><polygon points="596.0,865.0 578.0,855.1 578.0,874.9" fill="#6B7A88"/><rect x="608.0" y="740.0" width="400.0" height="250.0" rx="22" fill="#FBE8E5" stroke="none" stroke-width="0"/><g transform="translate(690,865) scale(1.0)"><ellipse cx="0" cy="0.0" rx="8.2" ry="10.0" fill="none" stroke="#D9483B" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 4" transform="rotate(-12)"/><ellipse cx="0" cy="1.5" rx="15.6" ry="19.0" fill="none" stroke="#D9483B" stroke-width="5" stroke-linecap="round" stroke-dasharray="27 7" transform="rotate(-3)"/><ellipse cx="0" cy="3.0" rx="23.0" ry="28.0" fill="none" stroke="#D9483B" stroke-width="5" stroke-linecap="round" stroke-dasharray="39 10" transform="rotate(6)"/><ellipse cx="0" cy="4.5" rx="30.3" ry="37.0" fill="none" stroke="#D9483B" stroke-width="5" stroke-linecap="round" stroke-dasharray="52 13" transform="rotate(15)"/><ellipse cx="0" cy="6.0" rx="37.7" ry="46.0" fill="none" stroke="#D9483B" stroke-width="5" stroke-linecap="round" stroke-dasharray="64 16" transform="rotate(24)"/><ellipse cx="0" cy="7.5" rx="45.1" ry="55.0" fill="none" stroke="#D9483B" stroke-width="5" stroke-linecap="round" stroke-dasharray="77 19" transform="rotate(33)"/></g><text x="780.0" y="844.0" font-family="Consolas, 'Courier New',